name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full CPU suite and installed-wheel qualification
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select checks
        id: changes
        run: python3 tests/ci_changes.py
      - name: Fetch model tables
        if: steps.changes.outputs.tests == 'true'
        run: git submodule update --init --recursive --depth 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.changes.outputs.tests == 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: steps.changes.outputs.tests == 'true'
      - run: uv sync --locked --group dev --extra reports
        if: steps.changes.outputs.tests == 'true'
      - run: uv run --no-sync ruff check src/toylife2 tests examples
        if: steps.changes.outputs.tests == 'true'
      - run: uv run --no-sync python -m pyright
        if: steps.changes.outputs.tests == 'true'
      - name: Routine CPU contracts
        if: steps.changes.outputs.tests == 'true' && steps.changes.outputs.full != 'true'
        run: >-
          uv run --no-sync python tests/check_cpu.py -q --strict-markers
          -m 'not integration and not qualification' --durations=15
          --junitxml=qualification/ci-cpu.xml
      - name: Full CPU qualification
        if: steps.changes.outputs.full == 'true'
        run: >-
          uv run --no-sync python tests/check_cpu.py -q --strict-markers
          --durations=15 --junitxml=qualification/ci-cpu.xml
      - run: uv build --wheel
        if: steps.changes.outputs.wheel == 'true'
      - run: uv run --no-sync python tests/check_wheel.py
        if: steps.changes.outputs.wheel == 'true'
